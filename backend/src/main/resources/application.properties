# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=myhealth
spring.data.mongodb.username=naresh
spring.data.mongodb.password=123456789
spring.data.mongodb.authentication-database=admin

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Logging Configuration
logging.level.com.dhrms.myhealth=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# JWT Configuration
jwt.secret=myHealthDhrmsSecretKey2024SIH
jwt.expiration=86400

# CORS Configuration
cors.allowed.origins=http://localhost:3000,http://localhost:8081
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
